<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101820" />
    <title>Gwangju AR Image Viewer</title>

    <link rel="stylesheet" href="styles.css" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  </head>

  <body>
    <main id="appShell" class="app-shell">
      <section class="topbar" aria-label="AR controls">
        <div class="brand">
          <strong>Gwangju AR</strong>
          <span id="statusText">카메라 준비 중</span>
        </div>

        <div class="controls">
          <label class="file-button" for="imageInput" title="이미지 선택">
            <span aria-hidden="true">+</span>
            <span>이미지</span>
          </label>
          <input id="imageInput" class="visually-hidden" type="file" accept="image/*" />

          <button id="resetButton" class="icon-button" type="button" title="기본 이미지로 되돌리기" aria-label="기본 이미지로 되돌리기">
            ↺
          </button>
        </div>
      </section>

      <section id="notice" class="notice" aria-live="polite">
        <strong>HIRO 마커를 카메라에 비추세요.</strong>
        <span>선택한 이미지가 마커 위에 나타납니다.</span>
      </section>

      <a-scene
        id="arScene"
        class="ar-scene"
        embedded
        vr-mode-ui="enabled: false"
        renderer="antialias: false; alpha: true; precision: mediump; logarithmicDepthBuffer: false;"
        arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best; detectionMode: mono; maxDetectionRate: 30; sourceWidth: 640; sourceHeight: 480; displayWidth: 640; displayHeight: 480;">
        <a-assets timeout="8000">
          <img id="arTexture" src="jinnammun.png" crossorigin="anonymous" alt="" />
        </a-assets>

        <a-marker id="hiroMarker" preset="hiro" smooth="true" smoothCount="8" smoothTolerance="0.01" smoothThreshold="3">
          <a-entity id="imageAnchor" position="0 0.02 0" rotation="-90 0 0">
            <a-image
              id="arImage"
              src="#arTexture"
              width="2.2"
              height="1.35"
              material="shader: flat; transparent: true; alphaTest: 0.02;"
              animation__appear="property: scale; from: 0.92 0.92 0.92; to: 1 1 1; dur: 220; easing: easeOutQuad; startEvents: markerFound;">
            </a-image>
          </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
      </a-scene>
    </main>

    <script src="app.js"></script>
  </body>
</html>
