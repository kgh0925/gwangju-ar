<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gwangju Eupseong AR</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      renderer="logarithmicDepthBuffer: true;"
      vr-mode-ui="enabled: false">
      <a-marker preset="hiro">
        <a-image
          src="jinnammun.png"
          position="0 0.35 0"
          rotation="-90 0 0"
          width="2.2"
          height="1.35"
          animation="property: scale; from: 1 1 1; to: 1.08 1.08 1.08; dur: 900; dir: alternate; loop: true;">
        </a-image>

        <a-box
          position="0 0.9 0"
          rotation="0 45 0"
          depth="0.45"
          height="0.45"
          width="0.45"
          color="#ff3040"
          animation="property: rotation; to: 0 405 0; dur: 2400; easing: linear; loop: true;">
        </a-box>

        <a-text
          value="AR TEST IMAGE"
          position="0 1.35 0"
          rotation="-90 0 0"
          color="#fff3b0"
          align="center"
          width="4">
        </a-text>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
